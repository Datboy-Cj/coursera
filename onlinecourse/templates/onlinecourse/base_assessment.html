<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Online Course{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f7fa;color:#172b4d}main{max-width:1000px;margin:36px auto;padding:0 24px}.card{margin-bottom:18px}.lesson-copy{white-space:pre-line}header{background:#142d4e;color:white;padding:18px 30px}header a{color:white}.score{font-size:2rem;font-weight:700}</style>
</head><body><header class="d-flex justify-content-between"><a href="{% url 'onlinecourse:index' %}">Online Course</a><span>{{ user.first_name|default:user.username }}</span></header>
<main>{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
